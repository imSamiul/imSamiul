name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    name: ${{ matrix.theme }} cards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1 # avoid concurrent commits to the same branch
      matrix:
        theme: [light, dark]
        include:
          - theme: light
            css: ""
          - theme: dark
            # Dark override for the classic template. Check the first render and tweak colours if needed.
            css: |
              :root { --color-canvas-default: #0d1117; --color-fg-default: #e6edf3; --color-fg-muted: #8b949e; --color-border-default: #30363d; }
              body, .items-wrapper, h1, h2, h3, section { background: transparent !important; color: #e6edf3 !important; }
    steps:
      - name: Overview, achievements and community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: imSamiul
          template: classic
          filename: assets/metrics-overview-${{ matrix.theme }}.svg
          committer_branch: main
          config_timezone: Asia/Dhaka
          extras_css: ${{ matrix.css }}
          base: header, activity, community, repositories, metadata
          base_indepth: false
          config_display: large
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8

      - name: Languages, habits and lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: imSamiul
          template: classic
          filename: assets/metrics-languages-${{ matrix.theme }}.svg
          committer_branch: main
          config_timezone: Asia/Dhaka
          extras_css: ${{ matrix.css }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: no
          plugin_lines: yes
          plugin_lines_history_limit: 1

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: imSamiul
          template: classic
          filename: assets/metrics-calendar-${{ matrix.theme }}.svg
          committer_branch: main
          config_timezone: Asia/Dhaka
          extras_css: ${{ matrix.css }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Pinned repositories (auto-updated featured projects)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: imSamiul
          template: classic
          filename: assets/metrics-pinned-${{ matrix.theme }}.svg
          committer_branch: main
          config_timezone: Asia/Dhaka
          extras_css: ${{ matrix.css }}
          base: ""
          plugin_pinned: yes
          plugin_pinned_limit: 6
